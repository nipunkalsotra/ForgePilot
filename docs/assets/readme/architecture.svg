<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img" aria-labelledby="title desc"><title id="title">ForgePilot architecture and approval boundaries</title><desc id="desc">Developer request enters the VS Code panel, then TrueForge sessions own inference and MCP tools. Authenticated tools retrieve and propose; separate approvals drive native hunk review, accepted-only application and guarded undo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#167e72"/></marker></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-size:21px;font-weight:650;fill:#782e47}.b{font-size:16px;fill:#626b72}.k{font-size:12px;fill:#167e72;font-weight:650;letter-spacing:1px}.box{fill:#fff;stroke:#e2d7da;stroke-width:1.5}.arrow{fill:none;stroke:#167e72;stroke-width:2;marker-end:url(#a)}</style><rect width="1440" height="450" rx="18" fill="#fbfaf8"/>
<g transform="translate(42 48)"><text class="k">01 / REQUEST</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">VS Code / Agent Panel</text><text x="22" y="81" class="b">Prompt, live events, context inspector</text><text x="22" y="106" class="b">@file + @symbol references</text></g>
<g transform="translate(520 48)"><text class="k">02 / TRUEFORGE OWNS THE LOOP</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">SDK + isolated agent session</text><text x="22" y="81" class="b">Inference, streaming, persisted turns</text><text x="22" y="106" class="b">Deferred schemas + native compaction</text></g>
<g transform="translate(998 48)"><text class="k">03 / AUTHENTICATED CAPABILITIES</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">Scoped MCP companion</text><text x="22" y="81" class="b">Ranked retrieval + exact proposal drafts</text><text x="22" y="106" class="b">Individually approved verification</text></g>
<path class="arrow" d="M452 123H505"/><path class="arrow" d="M930 123H983"/><path class="arrow" d="M1198 194V249"/>
<g transform="translate(998 248)"><text class="k">04 / DEVELOPER DECISIONS</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">Native diff review</text><text x="22" y="81" class="b">Staging approval is separate from apply</text><text x="22" y="106" class="b">Accept or reject every file / hunk</text></g>
<g transform="translate(520 248)"><text class="k">05 / ACCEPTED CHANGES</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">WorkspaceEdit + explicit save</text><text x="22" y="81" class="b">Hash and version conflict checks</text><text x="22" y="106" class="b">Rejected hunks are excluded</text></g>
<g transform="translate(42 248)"><text class="k">06 / CONTROL AFTER APPLY</text><rect y="17" width="400" height="119" rx="12" class="box"/><text x="22" y="51" class="h">Guarded undo</text><text x="22" y="81" class="b">Restore known preceding contents</text><text x="22" y="106" class="b">Refuse unsafe restoration after changes</text></g>
<path class="arrow" d="M985 323H933"/><path class="arrow" d="M507 323H455"/><text x="42" y="421" class="b" style="font-size:12px">Command approval never grants source-write authority. The extension does not call a model provider directly.</text></svg>