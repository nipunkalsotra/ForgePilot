<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">ForgePilot — context into carefully reviewed code</title><desc id="desc">Animated brand illustration of context retrieval, the TrueForge agent loop, native review and accepted-only application. This is a workflow diagram, not a recording of an agent run.</desc>
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#f3eeed"/></linearGradient><linearGradient id="wine" x2="1" y2="1"><stop stop-color="#923f5b"/><stop offset="1" stop-color="#65233b"/></linearGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#782e47" stroke-opacity=".045"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dy="7" stdDeviation="12" flood-color="#582335" flood-opacity=".09"/></filter></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#697176}.label{font-size:14px;letter-spacing:2px;font-weight:650}.node{fill:#fffdfa;stroke:#e2d6da}.wire{fill:none;stroke:#cdb9c0;stroke-width:2}.moving{fill:#167e72}.halo{fill:none;stroke:#167e72;stroke-width:1;opacity:.16;transform-origin:1120px 235px;animation:breathe 8s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.12);opacity:.28}}@media(prefers-reduced-motion:reduce){.moving{display:none}.halo{animation:none}}</style>
<rect width="1440" height="540" rx="22" fill="url(#paper)"/><rect width="1440" height="540" rx="22" fill="url(#grid)"/>
<rect x="55" y="54" width="5" height="25" rx="2" fill="#167e72"/><text x="77" y="73" class="label" fill="#782e47">CODECRAFTERS / TRUEFORGE-NATIVE</text>
<text x="55" y="181" font-size="91" font-weight="760" letter-spacing="-4" fill="#782e47">ForgePilot</text>
<text x="59" y="238" font-size="32" font-weight="620" fill="#24282c">Find the right code.</text><text x="59" y="282" font-size="32" font-weight="620" fill="#24282c">Keep control of every change.</text>
<text x="60" y="328" font-size="18" class="muted">TrueForge runs the agent. VS Code keeps the review.</text>
<path d="M60 373H701" stroke="#dfd4d7"/>
<g transform="translate(60 407)"><text font-size="30" font-weight="730" fill="#782e47">140/140</text><text y="28" class="label muted" style="font-size:11px;letter-spacing:1px">TESTS · NODE 22 + 24</text></g>
<g transform="translate(292 407)"><text font-size="30" font-weight="730" fill="#782e47">26</text><text y="28" class="label muted" style="font-size:11px;letter-spacing:1px">VS CODE COMMANDS</text></g>
<g transform="translate(511 407)"><text font-size="30" font-weight="730" fill="#782e47">12k</text><text y="28" class="label muted" style="font-size:11px;letter-spacing:1px">EST. RETRIEVAL BUDGET</text></g>
<circle cx="1120" cy="235" r="172" class="halo"/><circle cx="1120" cy="235" r="143" fill="none" stroke="#782e47" stroke-opacity=".055"/>
<path id="flow" d="M945 150H1160Q1200 150 1200 190V315Q1200 355 1160 355H945Q905 355 905 315V190Q905 150 945 150Z" class="wire"/>
<circle r="5" class="moving"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<g filter="url(#shadow)"><rect class="node" x="808" y="112" width="194" height="78" rx="13"/><rect x="1103" y="112" width="220" height="78" rx="13" fill="url(#wine)"/><rect class="node" x="1103" y="316" width="220" height="78" rx="13"/><rect class="node" x="808" y="316" width="194" height="78" rx="13"/></g>
<text x="831" y="141" font-size="12" fill="#167e72" font-weight="700">01 / RETRIEVE</text><text x="831" y="168" font-size="20" fill="#25282b" font-weight="650">Relevant context</text>
<text x="1126" y="141" font-size="12" fill="#e8dbdf" font-weight="700">02 / ORCHESTRATE</text><text x="1126" y="168" font-size="20" fill="white" font-weight="650">TrueForge session</text>
<text x="1126" y="345" font-size="12" fill="#167e72" font-weight="700">03 / REVIEW</text><text x="1126" y="372" font-size="20" fill="#25282b" font-weight="650">Every native hunk</text>
